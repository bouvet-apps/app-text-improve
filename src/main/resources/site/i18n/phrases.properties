application.description = Let ChatGPT quality control your text.

widgets.text-improve.info = Microtest your text content.
widgets.text-improve.expectation = Check reader expectations
widgets.text-improve.expectationInfo = Check which expectations a reader has based on the title and preface:
widgets.text-improve.verify = Verify reader expectations
widgets.text-improve.verifyInfo = Check if the text corresponds with the reader's expectations:
widgets.text-improve.infoTitle = Text improve
widgets.text-improve.infoSubtitle = - automated microtest of text content -
widgets.text-improve.infoDescription1 = A text always has a message you want to convey. But does the message align with a reader's expectation of the text? A microtest of the text can improve and make the text more user-oriented. Users often have questions that you haven't thought of yourself.
widgets.text-improve.infoDescription2 = Laura Arlov (Skatteetaten) has developed a method for running a quick microtest of textual content. The method involves letting a number of test users read the title and preface of a text. The test users then write down questions they expect to be answered in the rest of the text. The test users then read the rest of the text and note whether their questions were answered.
widgets.text-improve.infoDescription3 = Then you look at the following:
widgets.text-improve.infoListItem1 = Are the questions well enough answered?
widgets.text-improve.infoListItem2 = Is there unnecessary information?
widgets.text-improve.infoDescription4 = The results from such a microtest can be used to improve the content of the text, so that it aligns more with the readers' expectations.
widgets.text-improve.infoDescription5 = This widget is based on the method outlined above, but automates the process by using AI (ChatGPT) instead of actual test persons. This way, editors can quickly and easily quality-check their texts, directly in Content Studio!
widgets.text-improve.infoClose = Close
