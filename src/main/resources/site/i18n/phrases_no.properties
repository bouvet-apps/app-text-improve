application.description = La ChatGPT kjøre kvalitetskontroll på teksten din.

widgets.text-improve.info = Mikrotest av tekstinnhold.
widgets.text-improve.expectation = Sjekk leserforventninger
widgets.text-improve.expectationInfo = Sjekk hvilke forventninger en leser har basert på tittel og ingress:
widgets.text-improve.verify = Verifiser leserforventninger
widgets.text-improve.verifyInfo = Sjekk om teksten besvarer leserens forventninger:
widgets.text-improve.infoTitle = Text improve
widgets.text-improve.infoSubtitle = - automatisert mikrotest av tekstinnhold -
widgets.text-improve.infoDescription1 = En tekst har alltid et budskap man ønsker å få frem. Men står budskapet i tråd med en lesers forventning til teksten? En mikrotest av teksten kan forbedre og brukerorientere teksten. Brukerne har ofte spørsmål som en selv ikke har tenkt på.
widgets.text-improve.infoDescription2 = Laura Arlov (Skatteetaten) har utviklet en metode for å kjøre en kjapp mikrotest av tekstlig innhold. Metoden går ut på at man lar et antall testbrukere få lese tittel og ingress for en tekst. Deretter skriver testbrukerne ned spørsmål de forventer å få besvart i resten av teksten. Testbrukerne leser så resten av teksten og noterer om de har fått svar på spørsmålene de skrev ned.
widgets.text-improve.infoDescription3 = Deretter ser man på følgende:
widgets.text-improve.infoListItem1 = Er spørsmålene godt nok besvart?
widgets.text-improve.infoListItem2 = Er det informasjon som er unødvendig?
widgets.text-improve.infoDescription4 = Resultatene fra en slik mikrotest kan brukes for å forbedre innholdet i teksten, slik at den står mer i stil med lesernes forventninger.
widgets.text-improve.infoDescription5 = Denne widgeten baserer seg på metoden som er skissert over, men automatiserer prosessen ved å bruke AI (ChatGPT) i stedet for faktiske testpersoner. På denne måten kan redaktører raskt og enkelt kvalitetssikre sine tekster, direkte i content studio!
widgets.text-improve.infoClose = Lukk
